<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles/main.css">
<title>Student Finance Tracker</title>
</head>
<body>
<header>
  <h1>Finance Tracker</h1>
</header>
<main>
  <input type="text" id="search" placeholder="Search regex..." />
  <table>
    <thead>
      <tr>
        <th>Description <button class="sort-btn" data-field="description" data-asc="true">↑</button></th>
        <th>Amount <button class="sort-btn" data-field="amount" data-asc="true">↑</button></th>
        <th>Category</th>
        <th>Date <button class="sort-btn" data-field="date" data-asc="true">↑</button></th>
      </tr>
    </thead>
    <tbody id="records-body"></tbody>
  </table>
</main>
<script type="module">
import { init } from './scripts/storage.js';
import { renderTable } from './scripts/ui.js';

await init();
renderTable();
</script>
</body>
</html>
